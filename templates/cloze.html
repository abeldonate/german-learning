<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloze Practice</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <a class="back-link" href="/">← All exercises</a>

    <h1>Fill in the Blank</h1>
    <p class="subtitle">Type the missing German word.</p>

    <section class="controls">
      <label for="wordLimit">
        Vocabulary size: <span id="wordLimitValue">{{ min_words }}</span> words
        (~<span id="coveragePercent">{{ initial_coverage }}</span>% of daily conversation)
      </label>
      <input
        type="range"
        id="wordLimit"
        min="{{ min_words }}"
        max="{{ max_words }}"
        step="{{ step }}"
        value="{{ min_words }}"
      >
      <div class="range-labels">
        <span>{{ min_words }}</span>
        <span>{{ max_words }}</span>
      </div>
    </section>

    <section class="story" id="sentenceBox" aria-live="polite">
      <p class="placeholder">Click "Generate" to get a sentence.</p>
    </section>

    <p class="feedback" id="feedback"></p>

    <section class="translation" id="translation" hidden>
      <h2>Translation</h2>
      <p id="translationText"></p>
    </section>

    <section class="actions">
      <button id="generateBtn">Generate</button>
      <button id="translateBtn" disabled>Translate</button>
      <button id="resetBtn" disabled>Restart</button>
    </section>

    <p class="shortcuts">
      Shortcuts: <kbd>{{ generate_key.label }}</kbd> Generate
      &nbsp;·&nbsp;
      <kbd>{{ translate_key.label }}</kbd> Translate
      &nbsp;·&nbsp;
      <kbd>Enter</kbd> Check answer
    </p>

    <p class="status" id="status"></p>
  </main>

  <script>
    window.APP_CONFIG = {
      generateKeyCode: {{ generate_key.code | tojson }},
      translateKeyCode: {{ translate_key.code | tojson }},
      coverageByWordLimit: {{ coverage_by_word_limit | tojson }},
    };
  </script>
  <script src="{{ url_for('static', filename='cloze.js') }}"></script>
</body>
</html>
